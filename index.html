<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harmonic Heartbeats - Daily Music & Trivia SMS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            900: '#881337',
                        }
                    },
                    animation: {
                        'bounce-slow': 'bounce 1.5s infinite',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overscroll-behavior-y: none;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.8); }
        .phone-bg {
            background-image: radial-gradient(circle, #334155 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #0f172a;
        }
        .glass-effect {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="phone-bg text-slate-100 min-h-screen flex items-center justify-center p-0 md:p-4">
    <div id="root" class="w-full h-full md:h-auto flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Artists (with verified trivia & songs) are loaded at runtime from the
        // shared dataset so the website and the WhatsApp bot use one source of truth.
        const ARTIST_DATASET_URL = './data/artists.json';

        // Builds a real "Listen Now" link from the artist and song, mirroring the
        // bot's songLinks module so both channels behave identically.
        const buildYouTubeSearchUrl = (artistName, songTitle) => {
            const query = encodeURIComponent(`${artistName} ${songTitle}`.trim());
            return `https://www.youtube.com/results?search_query=${query}`;
        };

        // Builds the embedded-player URL for the featured song so playback
        // continues through more of the SAME artist's songs rather than
        // stopping after one. Each artist carries a same-artist playlist
        // (artist.youtubePlaylistId) — the uploads playlist of that artist's
        // own YouTube channel — which we start from the featured video. We
        // deliberately avoid YouTube "Mix" radios (list=RD…), which drift to
        // other artists. If no playlist exists, we fall back to a playlist
        // built only from the artist's own verified videos, never a mix.
        const buildVideoEmbedUrl = (artist, song) => {
            const base = 'https://www.youtube.com/embed';
            const playerParams = 'rel=0&modestbranding=1&playsinline=1';

            if (artist.youtubePlaylistId) {
                return song.youtubeId
                    ? `${base}/${song.youtubeId}?list=${artist.youtubePlaylistId}&${playerParams}`
                    : `${base}/videoseries?list=${artist.youtubePlaylistId}&${playerParams}`;
            }

            const ownVideoIds = (artist.songs || []).map((s) => s.youtubeId).filter(Boolean);
            const continuationIds = ownVideoIds.filter((id) => id !== song.youtubeId);
            const adHocPlaylist = continuationIds.length ? `&playlist=${continuationIds.join(',')}` : '';
            return `${base}/${song.youtubeId}?${playerParams}${adHocPlaylist}`;
        };

        // Deterministic "artist of the day" — mirrors the bot's dailyArtist.js so the
        // website and the emailed link always land on the same artist for a given date.
        const hashDateString = (value) => {
            let hash = 0;
            for (let i = 0; i < value.length; i++) hash = (hash * 31 + value.charCodeAt(i)) >>> 0;
            return hash;
        };
        const dailyDateKey = (date) => date.toISOString().slice(0, 10);
        const getDailyArtist = (artists, date = new Date()) =>
            artists[hashDateString(dailyDateKey(date)) % artists.length];

        // Real public-domain artwork (paintings across movements) sourced from
        // The Metropolitan Museum of Art's Open Access collection. The Gallery
        // loads this dataset at runtime, replacing earlier stock placeholders.
        const ARTWORK_DATASET_URL = './data/artworks.json';

        // Adapts a loaded artist record into the shape the chat quiz consumes,
        // attaching a real listen link to each song.
        const getBandTriviaAndSongs = (artist) => ({
            triviaPool: artist.trivia,
            songs: artist.songs.map((song) => ({
                title: song.title,
                fact: song.fact,
                url: buildYouTubeSearchUrl(artist.name, song.title),
            })),
        });

        const PhoneHeader = ({ title, onBack, showBack }) => (
            <div className="bg-slate-900/95 backdrop-blur-md sticky top-0 z-20 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                <div className="w-1/3 flex justify-start">
                    {showBack && (
                        <button onClick={onBack} className="text-brand-500 hover:text-brand-400 transition-colors flex items-center text-sm font-semibold">
                            <i className="fas fa-chevron-left mr-1"></i> Back
                        </button>
                    )}
                </div>
                <div className="w-1/3 text-center font-bold text-slate-100 text-sm truncate">
                    {title}
                </div>
                <div className="w-1/3 flex justify-end text-slate-400 text-xs gap-2">
                    <i className="fas fa-signal"></i>
                    <i className="fas fa-wifi"></i>
                    <i className="fas fa-battery-full text-slate-200"></i>
                </div>
            </div>
        );

        const BottomNav = ({ activeTab, setActiveTab }) => {
            const tabs = [
                { id: 'today', icon: 'fa-calendar-day', label: 'Today' },
                { id: 'bands', icon: 'fa-music', label: 'Bands' },
                { id: 'art', icon: 'fa-palette', label: 'Gallery' },
            ];
            return (
                <div className="glass-effect sticky bottom-0 z-20 flex justify-around items-center py-4 px-2">
                    {tabs.map((tab) => (
                        <button
                            key={tab.id}
                            onClick={() => setActiveTab(tab.id)}
                            className={`flex flex-col items-center gap-1 transition-colors ${activeTab === tab.id ? 'text-brand-500' : 'text-slate-500 hover:text-slate-300'}`}
                        >
                            <i className={`fas ${tab.icon} text-xl`}></i>
                            <span className="text-[10px] font-semibold tracking-wider uppercase">{tab.label}</span>
                        </button>
                    ))}
                </div>
            );
        };

        const BandsList = ({ bands, onSelectBand }) => {
            const [search, setSearch] = useState('');

            const filteredBands = bands.filter(b =>
                b.name.toLowerCase().includes(search.toLowerCase()) ||
                b.genre.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="flex-1 overflow-y-auto custom-scrollbar bg-slate-900 pb-24 animate-fade-in">
                    <div className="p-4">
                        <h2 className="text-2xl font-extrabold text-white mb-1">Artists</h2>
                        <p className="text-slate-400 text-sm mb-4">Select a band for daily trivia & music.</p>

                        <div className="relative mb-6">
                            <i className="fas fa-search absolute left-3 top-3.5 text-slate-500"></i>
                            <input
                                type="text"
                                placeholder="Search bands or genres..."
                                className="w-full bg-slate-800 text-white border border-slate-700 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-brand-500 transition-colors"
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                            />
                        </div>

                        <div className="space-y-3">
                            {filteredBands.map((band, idx) => (
                                <button
                                    key={band.id}
                                    onClick={() => onSelectBand(band)}
                                    className="w-full text-left bg-slate-800/50 hover:bg-slate-700/50 border border-slate-700/50 rounded-2xl p-4 flex items-center gap-4 transition-all hover:scale-[1.02]"
                                    style={{ animationDelay: `${idx * 0.05}s` }}
                                >
                                    <div className="w-12 h-12 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/20">
                                        <i className={`fas ${band.icon} text-white text-lg`}></i>
                                    </div>
                                    <div className="flex-1 overflow-hidden">
                                        <h3 className="text-white font-bold truncate">{band.name}</h3>
                                        <p className="text-slate-400 text-xs truncate">{band.genre}</p>
                                    </div>
                                    <i className="fas fa-chevron-right text-slate-600 text-sm"></i>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const TypingIndicator = () => (
            <div className="flex items-center space-x-1 bg-slate-800 text-slate-300 w-16 p-3 rounded-2xl rounded-tl-sm shadow-sm animate-fade-in mb-4">
                <div className="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                <div className="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                <div className="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
            </div>
        );

        const SMSChat = ({ band }) => {
            const [messages, setMessages] = useState([]);
            const [isTyping, setIsTyping] = useState(false);
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(-1);
            const [score, setScore] = useState(0);
            const [quizFinished, setQuizFinished] = useState(false);
            const messagesEndRef = useRef(null);
            // Mirrors `score` synchronously so endGame() reads the final tally
            // even for the last question, whose setScore hasn't committed yet.
            const scoreRef = useRef(0);

            const data = getBandTriviaAndSongs(band);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages, isTyping]);

            const addMessage = (msg) => {
                return new Promise(resolve => {
                    setMessages(prev => [...prev, msg]);
                    resolve();
                });
            };

            const simulateBotTyping = async (msg, typingDuration = 1200) => {
                setIsTyping(true);
                await new Promise(r => setTimeout(r, typingDuration));
                setIsTyping(false);
                await addMessage(msg);
            };

            const startGame = async () => {
                await simulateBotTyping({ type: 'bot', text: `Hey! Welcome to today's daily drop for ${band.name}. 🎸` }, 800);
                await simulateBotTyping({ type: 'bot', text: `Let's test your knowledge. Ready?` }, 1000);
                askQuestion(0);
            };

            useEffect(() => {
                startGame();
            }, []);

            const askQuestion = async (index) => {
                const q = data.triviaPool[index];
                if (!q) {
                    endGame();
                    return;
                }
                setCurrentQuestionIdx(index);
                await simulateBotTyping({ type: 'bot', text: q.question, options: q.options }, 1200);
            };

            const handleAnswer = async (selectedOption) => {
                if (quizFinished) return;

                setMessages(prev => {
                    const newMsgs = [...prev];
                    const lastBotMsg = newMsgs[newMsgs.length - 1];
                    if (lastBotMsg.options) {
                        lastBotMsg.answered = true;
                    }
                    return newMsgs;
                });

                await addMessage({ type: 'user', text: selectedOption });

                const q = data.triviaPool[currentQuestionIdx];
                const isCorrect = selectedOption === q.correctAnswer;

                if (isCorrect) {
                    scoreRef.current += 1;
                    setScore(scoreRef.current);
                }

                await simulateBotTyping({
                    type: 'bot',
                    text: isCorrect ? '✅ Spot on!' : `❌ Actually, it's ${q.correctAnswer}.`
                }, 900);

                await simulateBotTyping({ type: 'bot', text: q.explanation }, 1200);

                if (currentQuestionIdx + 1 < data.triviaPool.length) {
                    askQuestion(currentQuestionIdx + 1);
                } else {
                    endGame();
                }
            };

            const endGame = async () => {
                setQuizFinished(true);
                const total = data.triviaPool.length;
                const finalScore = scoreRef.current;
                await simulateBotTyping({ type: 'bot', text: `That's a wrap! You scored ${finalScore}/${total}. 🎵` }, 900);

                if (finalScore === total) {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#f43f5e', '#be123c', '#ffffff']
                    });
                }

                await simulateBotTyping({ type: 'bot', text: `Here are some iconic tracks to listen to today:` }, 1200);

                for (const song of data.songs) {
                    await simulateBotTyping({
                        type: 'bot',
                        isSong: true,
                        title: song.title,
                        fact: song.fact,
                        url: song.url
                    }, 1000);
                }
            };

            return (
                <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-slate-900 pb-28">
                    <div className="text-center text-xs text-slate-500 my-4 uppercase tracking-widest font-semibold">
                        Today at {new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                    </div>

                    {messages.map((msg, i) => (
                        <div key={i} className={`flex flex-col animate-slide-up ${msg.type === 'user' ? 'items-end' : 'items-start'}`}>
                            {msg.isSong ? (
                                <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 max-w-[85%] shadow-md">
                                    <div className="flex items-start gap-3">
                                        <div className="bg-brand-500/20 text-brand-500 rounded-full p-2 mt-1">
                                            <i className="fas fa-play"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-white mb-1">{msg.title}</h4>
                                            <p className="text-xs text-slate-400 mb-3">{msg.fact}</p>
                                            <a href={msg.url} target="_blank" className="inline-block bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold py-2 px-4 rounded-full transition-colors">
                                                Listen Now
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className={`px-4 py-3 max-w-[80%] shadow-sm ${
                                    msg.type === 'user'
                                        ? 'bg-brand-600 text-white rounded-2xl rounded-tr-sm'
                                        : 'bg-slate-800 text-slate-100 rounded-2xl rounded-tl-sm'
                                }`}>
                                    <p className="text-sm leading-relaxed">{msg.text}</p>
                                </div>
                            )}

                            {msg.options && !msg.answered && (
                                <div className="flex flex-col gap-2 mt-3 w-full max-w-[80%] pl-2">
                                    {msg.options.map((opt, j) => (
                                        <button
                                            key={j}
                                            onClick={() => handleAnswer(opt)}
                                            className="bg-slate-800 hover:bg-slate-700 border border-brand-500/30 text-brand-400 text-left px-4 py-2.5 rounded-xl text-sm font-semibold transition-all hover:pl-5"
                                        >
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    ))}

                    {isTyping && <TypingIndicator />}
                    <div ref={messagesEndRef} />
                </div>
            );
        };

        const ArtGallery = () => {
            const [collection, setCollection] = useState(null);
            const [loadError, setLoadError] = useState(null);
            const [selectedFilter, setSelectedFilter] = useState('All');

            // Load the curated real-artwork dataset once when the gallery opens.
            useEffect(() => {
                fetch(ARTWORK_DATASET_URL)
                    .then((response) => {
                        if (!response.ok) throw new Error(`Failed to load artworks (${response.status})`);
                        return response.json();
                    })
                    .then((data) => setCollection(data))
                    .catch((error) => setLoadError(error.message));
            }, []);

            if (loadError) return <LoadingScreen message={`Couldn't load the gallery: ${loadError}`} />;
            if (collection === null) return <LoadingScreen message="Loading the gallery..." />;

            const artworks = collection.artworks;

            // Filter categories are derived from the data so they always match
            // what's actually in the collection.
            const categories = ['All', ...Array.from(new Set(artworks.map((art) => art.category)))];

            const filteredArtworks = selectedFilter === 'All'
                ? artworks
                : artworks.filter((art) => art.category === selectedFilter);

            return (
                <div className="flex-1 overflow-y-auto custom-scrollbar bg-slate-900 pb-24 animate-fade-in">
                    <div className="p-4">
                        <div className="flex items-center justify-between mb-1">
                            <h2 className="text-2xl font-extrabold text-white">Fine Art Gallery</h2>
                            <span className="text-xs bg-brand-500/20 text-brand-400 px-2.5 py-1 rounded-full font-semibold">
                                {filteredArtworks.length} Pieces
                            </span>
                        </div>
                        <p className="text-slate-400 text-sm mb-4">Public-domain masterworks from The Met's Open Access collection.</p>

                        <div className="flex gap-2 overflow-x-auto pb-3 mb-4 custom-scrollbar">
                            {categories.map((category, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => setSelectedFilter(category)}
                                    className={`px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors ${
                                        selectedFilter === category
                                            ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30'
                                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                    }`}
                                >
                                    {category}
                                </button>
                            ))}
                        </div>

                        <div className="columns-2 gap-3 space-y-3">
                            {filteredArtworks.map((art, idx) => (
                                <a
                                    key={idx}
                                    href={art.sourceUrl || '#'}
                                    target="_blank"
                                    rel="noopener"
                                    className="break-inside-avoid relative group rounded-xl overflow-hidden bg-slate-800 border border-slate-700/50 shadow-lg block"
                                >
                                    <div className="relative overflow-hidden bg-slate-900 min-h-[150px]">
                                        <img
                                            src={art.imageUrl}
                                            alt={`${art.title} by ${art.artist}`}
                                            className="w-full h-auto object-cover transform transition-transform duration-700 group-hover:scale-110"
                                            loading="lazy"
                                            onError={(e) => {
                                                e.target.onerror = null;
                                                e.target.src = "https://placehold.co/600x800/1e293b/f43f5e?text=Artwork";
                                            }}
                                        />
                                        <div className="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-sm text-[9px] text-brand-300 px-2 py-0.5 rounded-md font-semibold border border-brand-500/30">
                                            {art.category}
                                        </div>
                                    </div>
                                    <div className="p-3 bg-gradient-to-t from-slate-900 via-slate-900/90 to-slate-900/40">
                                        <h3 className="text-white text-xs font-bold truncate mb-0.5">{art.title}</h3>
                                        <p className="text-brand-400 text-[10px] truncate font-medium">{art.artist} • {art.year}</p>
                                        {art.medium && <p className="text-slate-400 text-[9px] line-clamp-2 mt-1 opacity-80">{art.medium}</p>}
                                    </div>
                                </a>
                            ))}
                        </div>

                        <p className="text-slate-500 text-[10px] text-center mt-6">
                            Artworks courtesy of{' '}
                            <a href={collection.sourceUrl} target="_blank" rel="noopener" className="text-brand-400 hover:text-brand-300 underline">
                                The Metropolitan Museum of Art — Open Access
                            </a>
                        </p>
                    </div>
                </div>
            );
        };

        const DailyTrivia = ({ questions }) => {
            const [index, setIndex] = useState(0);
            const [selected, setSelected] = useState(null);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);

            const question = questions[index];
            const answered = selected !== null;

            const choose = (option) => {
                if (answered) return;
                setSelected(option);
                if (option === question.correctAnswer) setScore((s) => s + 1);
            };

            const next = () => {
                if (index + 1 < questions.length) {
                    setIndex(index + 1);
                    setSelected(null);
                } else {
                    setFinished(true);
                    if (score === questions.length) {
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#f43f5e', '#be123c', '#ffffff'] });
                    }
                }
            };

            if (finished) {
                return (
                    <div className="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-6 text-center">
                        <p className="text-slate-300 text-sm uppercase tracking-widest mb-1">Your score</p>
                        <p className="text-4xl font-extrabold text-white mb-2">{score}/{questions.length}</p>
                        <p className="text-brand-400 font-semibold">{score === questions.length ? 'Perfect! 🏆' : 'Come back tomorrow for a new artist! 🎶'}</p>
                    </div>
                );
            }

            return (
                <div className="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4">
                    <p className="text-slate-400 text-xs uppercase tracking-widest mb-2">Question {index + 1} of {questions.length}</p>
                    <h4 className="text-white font-bold mb-4">{question.question}</h4>
                    <div className="space-y-2">
                        {question.options.map((option, i) => {
                            const isCorrect = option === question.correctAnswer;
                            const isPicked = option === selected;
                            let style = 'bg-slate-800 border-slate-700 text-slate-200 hover:border-brand-500/50';
                            if (answered && isCorrect) style = 'bg-green-500/20 border-green-500 text-green-300';
                            else if (answered && isPicked) style = 'bg-red-500/20 border-red-500 text-red-300';
                            else if (answered) style = 'bg-slate-800 border-slate-700 text-slate-500';
                            return (
                                <button key={i} onClick={() => choose(option)} disabled={answered}
                                    className={`w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold border transition-all ${style}`}>
                                    {option}
                                </button>
                            );
                        })}
                    </div>
                    {answered && (
                        <div className="mt-4 animate-fade-in">
                            <p className="text-slate-300 text-sm mb-3"><span className="font-bold text-white">Why:</span> {question.explanation}</p>
                            <button onClick={next} className="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-2.5 rounded-xl transition-colors">
                                {index + 1 < questions.length ? 'Next question' : 'See my score'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // Renders the daily "video + trivia" experience for a single artist.
        // The Today tab passes no `artist` and falls back to the artist of the
        // day; selecting a band passes that band so it opens the same layout.
        const DailyView = ({ artists, artist: selectedArtist }) => {
            const artist = selectedArtist || getDailyArtist(artists);
            const isDailyFeature = !selectedArtist;
            const featuredSong = artist.songs[0];
            const today = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

            return (
                <div className="flex-1 overflow-y-auto custom-scrollbar bg-slate-900 pb-24 animate-fade-in">
                    <div className="p-4 space-y-5">
                        <div>
                            <p className="text-brand-400 text-xs font-bold uppercase tracking-widest">
                                {isDailyFeature ? today : artist.genre}
                            </p>
                            <h2 className="text-2xl font-extrabold text-white mt-1">
                                {isDailyFeature ? "Today's Artist" : artist.name}
                            </h2>
                        </div>

                        <div className="flex items-center gap-4">
                            <div className="w-14 h-14 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/20">
                                <i className={`fas ${artist.icon || 'fa-music'} text-white text-xl`}></i>
                            </div>
                            <div>
                                <h3 className="text-white text-xl font-bold">{artist.name}</h3>
                                <p className="text-slate-400 text-sm">{artist.genre}</p>
                            </div>
                        </div>

                        <div>
                            <p className="text-slate-300 text-sm font-semibold mb-2">🎬 {featuredSong.title}</p>
                            {(featuredSong.youtubeId || artist.youtubePlaylistId) ? (
                                <div className="relative w-full rounded-xl overflow-hidden border border-slate-700" style={{ paddingBottom: '56.25%' }}>
                                    <iframe className="absolute inset-0 w-full h-full" src={buildVideoEmbedUrl(artist, featuredSong)}
                                        title={`${featuredSong.title} — ${artist.name} playlist`} frameBorder="0" loading="lazy"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe>
                                </div>
                            ) : (
                                <a href={buildYouTubeSearchUrl(artist.name, featuredSong.title)} target="_blank" rel="noopener"
                                    className="flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 rounded-xl transition-colors">
                                    <i className="fab fa-youtube"></i> Watch on YouTube
                                </a>
                            )}
                            {(featuredSong.youtubeId || artist.youtubePlaylistId) && (
                                <p className="text-slate-500 text-[11px] mt-2">▶ Keep listening — playback continues through more {artist.name} songs.</p>
                            )}
                            {featuredSong.fact && <p className="text-slate-400 text-xs mt-2 italic">{featuredSong.fact}</p>}
                        </div>

                        {artist.bio && (
                            <div>
                                <h4 className="text-white font-bold mb-2">📖 About {artist.name}</h4>
                                <p className="text-slate-300 text-sm leading-relaxed">{artist.bio}</p>
                            </div>
                        )}

                        <div>
                            <h4 className="text-white font-bold mb-3">🎵 Today's Trivia</h4>
                            <DailyTrivia questions={artist.trivia} key={artist.id} />
                        </div>
                    </div>
                </div>
            );
        };

        const LoadingScreen = ({ message }) => (
            <div className="flex-1 flex flex-col items-center justify-center text-center p-8 gap-4 animate-fade-in">
                <i className="fas fa-compact-disc text-4xl text-brand-500 animate-spin"></i>
                <p className="text-slate-400 text-sm">{message}</p>
            </div>
        );

        const App = () => {
            // The daily email links to "#today", which should open the Today tab.
            const initialTab = window.location.hash.replace('#', '') === 'today' ? 'today' : 'bands';
            const [activeTab, setActiveTab] = useState(initialTab);
            const [selectedBand, setSelectedBand] = useState(null);
            const [artists, setArtists] = useState(null);
            const [loadError, setLoadError] = useState(null);

            // Load the shared artist dataset once when the app mounts.
            useEffect(() => {
                fetch(ARTIST_DATASET_URL)
                    .then((response) => {
                        if (!response.ok) throw new Error(`Failed to load artists (${response.status})`);
                        return response.json();
                    })
                    .then((data) => setArtists(data.artists))
                    .catch((error) => setLoadError(error.message));
            }, []);

            const handleBack = () => {
                setSelectedBand(null);
            };

            const getHeaderTitle = () => {
                if (selectedBand) return selectedBand.name;
                if (activeTab === 'today') return "Today";
                if (activeTab === 'bands') return "Daily Lineup";
                return "Gallery";
            };

            const renderMainContent = () => {
                if (selectedBand) return <DailyView artist={selectedBand} key={selectedBand.id} />;
                if (loadError) return <LoadingScreen message={`Couldn't load artists: ${loadError}`} />;
                if (activeTab === 'art') return <ArtGallery />;
                if (artists === null) return <LoadingScreen message="Loading today's music..." />;
                if (activeTab === 'today') return <DailyView artists={artists} />;
                return <BandsList bands={artists} onSelectBand={setSelectedBand} />;
            };

            return (
                <div className="relative w-full max-w-md h-[100dvh] md:h-[850px] md:rounded-[3rem] md:shadow-2xl md:border-[12px] border-slate-800 bg-slate-900 overflow-hidden flex flex-col mx-auto">
                    <div className="hidden md:block absolute top-0 inset-x-0 h-7 w-40 bg-slate-800 mx-auto rounded-b-3xl z-30"></div>

                    <PhoneHeader
                        title={getHeaderTitle()}
                        onBack={handleBack}
                        showBack={selectedBand !== null}
                    />

                    <div className="flex-1 relative overflow-hidden flex flex-col bg-slate-900">
                        {renderMainContent()}
                    </div>

                    {!selectedBand && (
                        <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />
                    )}

                    <div className="absolute bottom-2 left-1/2 transform -translate-x-1/2 w-1/3 h-1 bg-white/20 rounded-full z-30"></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
